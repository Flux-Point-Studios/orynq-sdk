name: anchor-worker image

# Builds ghcr.io/flux-point-studios/anchor-worker:<sha> from the monorepo. Pull
# requests build and smoke-test the image without pushing it. Deploying is a
# manual image bump on the host that runs the worker.

on:
  push:
    branches: [main]
    paths:
      - 'services/anchor-worker/**'
      - 'packages/anchors-cardano/**'
      - 'packages/process-trace/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/anchor-worker.yml'
  pull_request:
    paths:
      - 'services/anchor-worker/**'
      - 'packages/anchors-cardano/**'
      - 'packages/process-trace/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/anchor-worker.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/flux-point-studios/anchor-worker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: docker build -f services/anchor-worker/Dockerfile -t "$IMAGE:${{ github.sha }}" .

      # ESM links every import before validateEnv runs, so this output also
      # proves the image's dependency tree resolves.
      - name: Refuses to start without its configuration
        run: |
          if out=$(docker run --rm "$IMAGE:${{ github.sha }}" 2>&1); then
            echo "the worker started with no environment"; exit 1
          fi
          echo "$out"
          grep -q "Missing required environment variables: ANCHOR_WORKER_TOKEN, BLOCKFROST_PROJECT_ID, CARDANO_NETWORK, WALLET_SEED_PHRASE" <<<"$out"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        run: docker push "$IMAGE:${{ github.sha }}"

      - name: Push latest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:latest"
