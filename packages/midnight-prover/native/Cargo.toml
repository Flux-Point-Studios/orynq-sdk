[package]
name = "orynq-midnight-verifier"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
base64 = "0.22.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
ledger = { package = "midnight-ledger", git = "https://github.com/midnightntwrk/midnight-ledger.git", rev = "b5d3e965a18e4cac17fac4f38446fc55c524439a", default-features = false, features = ["proof-verifying"] }
serialize = { package = "midnight-serialize", git = "https://github.com/midnightntwrk/midnight-ledger.git", rev = "b5d3e965a18e4cac17fac4f38446fc55c524439a" }
storage = { package = "midnight-storage", git = "https://github.com/midnightntwrk/midnight-ledger.git", rev = "b5d3e965a18e4cac17fac4f38446fc55c524439a" }
base-crypto = { package = "midnight-base-crypto", git = "https://github.com/midnightntwrk/midnight-ledger.git", rev = "b5d3e965a18e4cac17fac4f38446fc55c524439a" }
transient-crypto = { package = "midnight-transient-crypto", git = "https://github.com/midnightntwrk/midnight-ledger.git", rev = "b5d3e965a18e4cac17fac4f38446fc55c524439a" }
onchain-runtime = { package = "midnight-onchain-runtime", git = "https://github.com/midnightntwrk/midnight-ledger.git", rev = "b5d3e965a18e4cac17fac4f38446fc55c524439a" }

[dev-dependencies]
rand = "0.8.5"

[profile.release]
lto = "thin"

[profile.dev.package."*"]
opt-level = 2
