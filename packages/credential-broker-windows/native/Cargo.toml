[package]
name = "orynq-pipe-frontend"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
