# A push to main publishes every package version that npm does not have yet, so a push
# without a version bump publishes nothing. The version PR (`pnpm changeset version`) is
# opened by hand: Woodpecker holds no GitHub token that could push it.
#
# pack installs, builds and packs without the npm token; pull requests run it too, as a
# rehearsal. Only publish, the ci/npm-publish plugin of materios-operator-kit, holds the
# token: the npm_token secret's image filter names the digest pinned below, so no step that
# runs an install, build or package script can receive it. The plugin refuses restarts, so a
# failed publish is retried by the next push to main, which packs only what is still missing.
#
# release-guard runs before anything is built or packed, after the install that gives it npm's
# semver and npm-package-arg: it refuses a public package with a runtime dependency on a private
# one or on a local path, a version npm would record differently, and a version below one npm
# already has. post-publish-check
# installs what was published from npm and requires one copy of each WASM singleton.
when:
  - event: pull_request
  - event: push
    branch: main

depends_on: [ci]

labels:
  platform: linux/amd64

# The private t-backend submodule is not a CI build input.
clone:
  - name: clone
    image: woodpeckerci/plugin-git@sha256:9802cb7852dcf31f9c5c1d1ddeadfb9002d4fae85751f7b6a792eedb267bcc59
    settings:
      recursive: false

steps:
  - name: pack
    image: node:24-bookworm@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
    commands:
      - corepack enable
      - pnpm install --frozen-lockfile
      - node tools/release-guard/release-guard.mjs
      - tools/compactc/install.sh "$$HOME/.cache/midnight/compactc" "$$HOME/.cache/midnight/zk-params"
      - COMPACTC="$$HOME/.cache/midnight/compactc/compactc" MIDNIGHT_PP="$$HOME/.cache/midnight/zk-params" pnpm --filter @fluxpointstudios/orynq-sdk-midnight-prover build:circuits
      - pnpm build
      - pnpm --filter @fluxpointstudios/orynq-sdk-midnight-prover verify:artifacts
      - node scripts/pack-unpublished.mjs /woodpecker/npm-publish

  - name: publish
    image: ghcr.io/flux-point-studios/materios-operator-kit@sha256:ce7e0b4eb5db06bf2907035dfab6bb8aff13ff3059256eaf7f38eaf22fb73ceb
    settings:
      dir: /woodpecker/npm-publish
      token:
        from_secret: npm_token
    when:
      - event: push
        branch: main

  - name: post-publish-check
    image: node:24-bookworm@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
    commands:
      - node tools/release-guard/post-publish-check.mjs /woodpecker/npm-publish
    when:
      - event: push
        branch: main
