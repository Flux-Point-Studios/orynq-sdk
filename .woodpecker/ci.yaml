when:
  - event: pull_request
  - event: push
    branch: main

labels:
  platform: linux/amd64

# The private t-backend submodule is not a CI build input.
clone:
  - name: clone
    image: woodpeckerci/plugin-git@sha256:9802cb7852dcf31f9c5c1d1ddeadfb9002d4fae85751f7b6a792eedb267bcc59
    settings:
      recursive: false

steps:
  # Root defeats the recorder's unreadable-session-file probe, so everything runs as node. The
  # one pnpm install and the one Compact install here serve every step that depends on this one;
  # installing again in a parallel step would race this install in the shared workspace.
  - name: build-test
    image: node:24-bookworm@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
    depends_on: []
    environment:
      COMPACTC: /woodpecker/orynq-midnight-tools/compactc/compactc
      MIDNIGHT_PP: /woodpecker/orynq-midnight-tools/zk-params
    commands:
      - corepack enable
      - mkdir -p /woodpecker/orynq-midnight-tools /woodpecker/orynq-broker-tools
      - chown -R node:node . /woodpecker/orynq-midnight-tools /woodpecker/orynq-broker-tools
      - |
        su node -s /bin/bash -c '
          set -e
          tools/compactc/install.sh /woodpecker/orynq-midnight-tools/compactc /woodpecker/orynq-midnight-tools/zk-params
          pnpm install --frozen-lockfile
          node --test scripts/dependency-security.test.mjs
          pnpm --filter @fluxpointstudios/orynq-sdk-midnight-prover build:circuits
          pnpm build
          pnpm typecheck
          pnpm lint
          pnpm exec vitest run --maxWorkers=2
          pnpm vectors:verify
        '

  - name: midnight-native
    image: rust:1.99.0-bookworm@sha256:114c7a4425406451c2866b6aafe69fe29b1b298832db1277d411ac73c82d04d6
    depends_on: [build-test]
    backend_options:
      docker:
        user: '1000:1000'
    environment:
      CARGO_BUILD_JOBS: '4'
      CARGO_HOME: /tmp/orynq-midnight-cargo
      CARGO_TARGET_DIR: /woodpecker/orynq-midnight-tools/native-target
    commands:
      - test "$(id -u)" = 1000
      - rustup component add --toolchain 1.99.0 rustfmt clippy
      - bash packages/midnight-prover/native/check-verify-only-boundary.sh
      - cargo +1.99.0 install cargo-audit --version 0.22.2 --locked
      - cargo +1.99.0 audit --file packages/midnight-prover/native/Cargo.lock --deny warnings --ignore RUSTSEC-2026-0253 --ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0387
      - cargo +1.99.0 fmt --manifest-path packages/midnight-prover/native/Cargo.toml -- --check
      - cargo +1.99.0 clippy --release --locked --manifest-path packages/midnight-prover/native/Cargo.toml --all-targets -- -D warnings
      - cargo +1.99.0 build --release --locked --manifest-path packages/midnight-prover/native/Cargo.toml
      - cargo +1.99.0 test --release --locked --manifest-path packages/midnight-prover/native/Cargo.toml

  # The Linux socket frontend: its tests run the binary against real sockets as uid 1000, and the
  # release build is kept for the broker's socket suite.
  - name: broker-native
    image: rust:1.99.0-bookworm@sha256:114c7a4425406451c2866b6aafe69fe29b1b298832db1277d411ac73c82d04d6
    depends_on: [build-test]
    backend_options:
      docker:
        user: '1000:1000'
    environment:
      CARGO_BUILD_JOBS: '4'
      CARGO_HOME: /tmp/orynq-broker-cargo
      CARGO_TARGET_DIR: /tmp/orynq-broker-target
    commands:
      - test "$(id -u)" = 1000
      - rustup component add --toolchain 1.99.0 rustfmt clippy
      - cargo +1.99.0 install cargo-audit --version 0.22.2 --locked
      - cargo +1.99.0 audit --file packages/broker/native/Cargo.lock --deny warnings
      - cargo +1.99.0 fmt --manifest-path packages/broker/native/Cargo.toml -- --check
      - cargo +1.99.0 clippy --release --locked --manifest-path packages/broker/native/Cargo.toml --all-targets -- -D warnings
      - cargo +1.99.0 build --release --locked --manifest-path packages/broker/native/Cargo.toml
      - cargo +1.99.0 test --release --locked --manifest-path packages/broker/native/Cargo.toml
      - install -m 0755 /tmp/orynq-broker-target/release/orynq-socket-frontend /woodpecker/orynq-broker-tools/orynq-socket-frontend

  # The broker's real-socket suite: the frontend binary, the Node host and the client, run as an
  # unprivileged user so the peer the kernel reports is that user.
  - name: broker-socket
    image: node:24-bookworm@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
    depends_on: [broker-native]
    environment:
      ORYNQ_SOCKET_FRONTEND: /woodpecker/orynq-broker-tools/orynq-socket-frontend
    commands:
      - corepack enable
      - su node -s /bin/bash -c 'pnpm --filter @fluxpointstudios/orynq-sdk-broker test:socket'

  # The pipe frontend only compiles for Windows and CI has no Windows agent, so this
  # type-checks and lints it for the Windows target (no linking). Its tests run on Windows.
  - name: broker-windows-native
    image: rust:1.99.0-bookworm@sha256:114c7a4425406451c2866b6aafe69fe29b1b298832db1277d411ac73c82d04d6
    depends_on: [build-test]
    backend_options:
      docker:
        user: '1000:1000'
    environment:
      CARGO_HOME: /tmp/orynq-broker-windows-cargo
      CARGO_TARGET_DIR: /tmp/orynq-broker-windows-target
    commands:
      - test "$(id -u)" = 1000
      - rustup component add --toolchain 1.99.0 rustfmt clippy
      - rustup target add --toolchain 1.99.0 x86_64-pc-windows-gnu
      - cargo +1.99.0 install cargo-audit --version 0.22.2 --locked
      - cargo +1.99.0 audit --file packages/credential-broker-windows/native/Cargo.lock --deny warnings
      - cargo +1.99.0 fmt --manifest-path packages/credential-broker-windows/native/Cargo.toml -- --check
      - cargo +1.99.0 clippy --locked --target x86_64-pc-windows-gnu --all-targets --manifest-path packages/credential-broker-windows/native/Cargo.toml -- -D warnings

  - name: midnight-real-proofs
    image: node:24-bookworm@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
    depends_on: [midnight-native]
    environment:
      ORYNQ_MIDNIGHT_PARAMS_DIR: /woodpecker/orynq-midnight-tools/zk-params
      ORYNQ_MIDNIGHT_NATIVE_VERIFIER: /woodpecker/orynq-midnight-tools/native-target/release/orynq-midnight-verifier
    commands:
      - corepack enable
      - su node -s /bin/bash -c 'pnpm --filter @fluxpointstudios/orynq-sdk-midnight-prover test:real'

  # The cross-language vector tests shell out to the TS harness, so this needs
  # node and the workspace build-test installed.
  - name: python-test
    image: nikolaik/python-nodejs:python3.11-nodejs24@sha256:90538671c42b08e126729c81110c89aeda3c860168888de88f7afaf024b3bbc2
    depends_on: [build-test]
    commands:
      - pip install -e "python/.[dev]"
      - pytest python/tests/
      - python packages/anchors-midnight-submit/runner/test/standing_watch_test.py
      - python packages/anchors-midnight-submit/runner/test/standing_accounting_test.py
      - python scripts/verify-hash-vectors.py

  # The registry contract is immutable once deployed: its committed build must be exactly what
  # the sha256-pinned compiler produces, and proving must keep every secret out of the bytes a
  # submitter sends. Proving takes about a minute on one core, so it runs at the lowest priority.
  - name: midnight-contract
    image: node:24-bookworm@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
    depends_on: [build-test]
    environment:
      COMPACTC: /woodpecker/orynq-midnight-tools/compactc/compactc
      MIDNIGHT_PP: /woodpecker/orynq-midnight-tools/zk-params
    commands:
      - corepack enable
      - |
        su node -s /bin/bash -c '
          set -e
          nice -n 19 packages/anchors-midnight/contract/compile.sh --check
          cd packages/anchors-midnight
          pnpm test:journal
          nice -n 19 pnpm test:slow
        '

  # The conduct circuits compile with build-test's Compact install and must reproduce their
  # pins. Their suite runs only here, through its own vitest config.
  - name: conduct-circuits
    image: node:24-bookworm@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
    depends_on: [build-test]
    environment:
      COMPACTC: /woodpecker/orynq-midnight-tools/compactc/compactc
      MIDNIGHT_PP: /woodpecker/orynq-midnight-tools/zk-params
    commands:
      - corepack enable
      - |
        su node -s /bin/bash -c '
          set -e
          pnpm --filter @fluxpointstudios/orynq-sdk-midnight-prover build:conduct
          pnpm exec vitest run --config packages/midnight-prover/vitest.conduct.config.mts --maxWorkers=2
        '

  # The submitter proves with the installer's pinned DUST spend keys and parameters. pnpm test
  # also runs the preprod rehearsal's offline suite (the evidence gate, verify-all, compose and
  # finish.sh over a synthetic rehearsal), which runs git as the workspace's owner; nothing in
  # this step talks to a Midnight node or indexer.
  - name: midnight-submit
    image: node:24-bookworm@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
    depends_on: [build-test]
    environment:
      MIDNIGHT_PP: /woodpecker/orynq-midnight-tools/zk-params
    commands:
      - corepack enable
      - |
        su node -s /bin/bash -c '
          set -e
          cd packages/anchors-midnight-submit
          pnpm test
          nice -n 19 pnpm test:slow
        '

  # The Midnight mainnet runner's systemd user units, as systemd-analyze --user verify reads them
  # laid out as the install lays them out, verified by an unprivileged user.
  - name: midnight-runner-units
    image: debian:bookworm-slim@sha256:7ff6ba31527b9e336162fa061746c366c4b2032f4d2cff2078bea43f78efe3f8
    depends_on: []
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends systemd
      - useradd -m runner
      - su runner -s /bin/sh -c "$CI_WORKSPACE/packages/anchors-midnight-submit/runner/systemd/verify.sh"

  - name: path-check
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    depends_on: []
    commands:
      - |
        if grep -rE "(D:/fluxPoint|D:\\\\fluxPoint|C:/Users|C:\\\\Users)" packages/; then
          echo "ERROR: Local machine paths found in codebase"
          exit 1
        fi

  - name: security-audit
    image: node:24-bookworm@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
    depends_on: []
    commands:
      - corepack enable
      - pnpm audit --audit-level=high
