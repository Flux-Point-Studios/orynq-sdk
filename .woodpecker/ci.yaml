when:
  - event: pull_request
  - event: push
    branch: main

labels:
  platform: linux/amd64

# The private t-backend submodule is not a CI build input.
clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      recursive: false

steps:
  # Root defeats the recorder's unreadable-session-file probe.
  - name: build-test
    image: node:24-bookworm
    depends_on: []
    environment:
      COMPACTC: /woodpecker/orynq-midnight-tools/compact-0.31.1/compactc
      XDG_CACHE_HOME: /woodpecker/orynq-midnight-tools/cache
    commands:
      - corepack enable
      - mkdir -p /woodpecker/orynq-midnight-tools
      - chown -R node:node . /woodpecker/orynq-midnight-tools
      - |
        su node -s /bin/bash -c '
          pnpm install --frozen-lockfile &&
          node --test scripts/dependency-security.test.mjs &&
          node --test packages/midnight-prover/scripts/install-compact.test.mjs &&
          bash packages/midnight-prover/scripts/install-compact.sh /woodpecker/orynq-midnight-tools/compact-0.31.1 &&
          pnpm --filter @fluxpointstudios/orynq-sdk-midnight-prover build:circuits &&
          pnpm build &&
          pnpm typecheck &&
          pnpm --filter @fluxpointstudios/orynq-sdk-midnight-prover lint &&
          pnpm exec vitest run --maxWorkers=2 &&
          pnpm vectors:verify
        '

  - name: midnight-native
    image: rust:1.99.0-bookworm
    depends_on: [build-test]
    backend_options:
      docker:
        user: '1000:1000'
    environment:
      CARGO_BUILD_JOBS: '4'
      CARGO_HOME: /tmp/orynq-midnight-cargo
      CARGO_TARGET_DIR: /woodpecker/orynq-midnight-tools/native-target
    commands:
      - test "$(id -u)" = 1000
      - rustup component add --toolchain 1.99.0 rustfmt clippy
      - cargo +1.99.0 fmt --manifest-path packages/midnight-prover/native/Cargo.toml -- --check
      - cargo +1.99.0 clippy --locked --manifest-path packages/midnight-prover/native/Cargo.toml --all-targets -- -D warnings
      - cargo +1.99.0 build --release --locked --manifest-path packages/midnight-prover/native/Cargo.toml
      - cargo +1.99.0 test --release --locked --manifest-path packages/midnight-prover/native/Cargo.toml

  - name: midnight-real-proofs
    image: node:24-bookworm
    depends_on: [midnight-native]
    environment:
      ORYNQ_MIDNIGHT_PARAMS_DIR: /woodpecker/orynq-midnight-tools/cache/midnight/zk-params
      ORYNQ_MIDNIGHT_NATIVE_VERIFIER: /woodpecker/orynq-midnight-tools/native-target/release/orynq-midnight-verifier
    commands:
      - corepack enable
      - su node -s /bin/bash -c 'pnpm --filter @fluxpointstudios/orynq-sdk-midnight-prover test:real'

  # The cross-language vector tests shell out to the TS harness, so this needs
  # node and the workspace build-test installed.
  - name: python-test
    image: nikolaik/python-nodejs:python3.11-nodejs24
    depends_on: [build-test]
    commands:
      - pip install -e "python/.[dev]"
      - pytest python/tests/
      - python scripts/verify-hash-vectors.py

  # The registry contract is immutable once deployed: its committed build must be exactly what
  # the sha256-pinned compiler produces, and proving must keep every secret out of the bytes a
  # submitter sends. Proving takes about a minute on one core, so it runs at the lowest priority.
  # The submission journal needs node:sqlite, hence Node 24 here.
  - name: midnight-contract
    image: node:24-bookworm
    depends_on: []
    commands:
      - corepack enable
      - tools/compactc/install.sh ~/.cache/midnight/compactc ~/.cache/midnight/zk-params
      - COMPACTC=~/.cache/midnight/compactc/compactc MIDNIGHT_PP=~/.cache/midnight/zk-params nice -n 19 packages/anchors-midnight/contract/compile.sh --check
      - pnpm install --frozen-lockfile --filter @fluxpointstudios/orynq-sdk-anchors-midnight...
      - cd packages/anchors-midnight && pnpm test:journal && MIDNIGHT_PP=~/.cache/midnight/zk-params nice -n 19 pnpm test:slow

  # The submitter proves with the installer's pinned DUST spend keys and parameters and journals
  # in node:sqlite, hence Node 24 and the installed ZK directory. pnpm test also runs the preprod
  # rehearsal's offline suite (the evidence gate, verify-all, compose and finish.sh over a
  # synthetic rehearsal); nothing in this step talks to a Midnight node or indexer.
  - name: midnight-submit
    image: node:24-bookworm
    depends_on: []
    commands:
      # The rehearsal tests run git as root, and build-test re-owns the shared workspace to node
      # in parallel; without this, git refuses the checkout as having dubious ownership.
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - corepack enable
      - tools/compactc/install.sh ~/.cache/midnight/compactc ~/.cache/midnight/zk-params
      - pnpm install --frozen-lockfile --filter @fluxpointstudios/orynq-sdk-anchors-midnight-submit...
      - pnpm --filter "@fluxpointstudios/orynq-sdk-anchors-midnight-submit^..." build
      - cd packages/anchors-midnight-submit && pnpm typecheck && MIDNIGHT_PP=~/.cache/midnight/zk-params pnpm test && MIDNIGHT_PP=~/.cache/midnight/zk-params nice -n 19 pnpm test:slow

  - name: path-check
    image: alpine:3.20
    depends_on: []
    commands:
      - |
        if grep -rE "(D:/fluxPoint|D:\\\\fluxPoint|C:/Users|C:\\\\Users)" packages/; then
          echo "ERROR: Local machine paths found in codebase"
          exit 1
        fi

  - name: security-audit
    image: node:24-bookworm
    depends_on: []
    commands:
      - corepack enable
      - pnpm audit --audit-level=high
