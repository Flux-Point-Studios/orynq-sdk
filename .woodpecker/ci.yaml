when:
  - event: pull_request
  - event: push
    branch: main

labels:
  platform: linux/amd64

# The private t-backend submodule is not a CI build input.
clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      recursive: false

steps:
  # Root defeats the recorder's unreadable-session-file probe, so everything runs as node. The
  # one pnpm install and the one Compact install here serve every step that depends on this one;
  # installing again in a parallel step would race this install in the shared workspace.
  - name: build-test
    image: node:24-bookworm
    depends_on: []
    environment:
      COMPACTC: /woodpecker/orynq-midnight-tools/compactc/compactc
      MIDNIGHT_PP: /woodpecker/orynq-midnight-tools/zk-params
    commands:
      - corepack enable
      - mkdir -p /woodpecker/orynq-midnight-tools
      - chown -R node:node . /woodpecker/orynq-midnight-tools
      - |
        su node -s /bin/bash -c '
          set -e
          tools/compactc/install.sh /woodpecker/orynq-midnight-tools/compactc /woodpecker/orynq-midnight-tools/zk-params
          pnpm install --frozen-lockfile
          node --test scripts/dependency-security.test.mjs
          pnpm --filter @fluxpointstudios/orynq-sdk-midnight-prover build:circuits
          pnpm build
          pnpm typecheck
          pnpm --filter @fluxpointstudios/orynq-sdk-midnight-prover lint
          pnpm exec vitest run --maxWorkers=2
          pnpm vectors:verify
        '

  - name: midnight-native
    image: rust:1.99.0-bookworm
    depends_on: [build-test]
    backend_options:
      docker:
        user: '1000:1000'
    environment:
      CARGO_BUILD_JOBS: '4'
      CARGO_HOME: /tmp/orynq-midnight-cargo
      CARGO_TARGET_DIR: /woodpecker/orynq-midnight-tools/native-target
    commands:
      - test "$(id -u)" = 1000
      - rustup component add --toolchain 1.99.0 rustfmt clippy
      - cargo +1.99.0 fmt --manifest-path packages/midnight-prover/native/Cargo.toml -- --check
      - cargo +1.99.0 clippy --locked --manifest-path packages/midnight-prover/native/Cargo.toml --all-targets -- -D warnings
      - cargo +1.99.0 build --release --locked --manifest-path packages/midnight-prover/native/Cargo.toml
      - cargo +1.99.0 test --release --locked --manifest-path packages/midnight-prover/native/Cargo.toml

  - name: midnight-real-proofs
    image: node:24-bookworm
    depends_on: [midnight-native]
    environment:
      ORYNQ_MIDNIGHT_PARAMS_DIR: /woodpecker/orynq-midnight-tools/zk-params
      ORYNQ_MIDNIGHT_NATIVE_VERIFIER: /woodpecker/orynq-midnight-tools/native-target/release/orynq-midnight-verifier
    commands:
      - corepack enable
      - su node -s /bin/bash -c 'pnpm --filter @fluxpointstudios/orynq-sdk-midnight-prover test:real'

  # The cross-language vector tests shell out to the TS harness, so this needs
  # node and the workspace build-test installed.
  - name: python-test
    image: nikolaik/python-nodejs:python3.11-nodejs24
    depends_on: [build-test]
    commands:
      - pip install -e "python/.[dev]"
      - pytest python/tests/
      - python packages/anchors-midnight-submit/runner/test/standing_watch_test.py
      - python packages/anchors-midnight-submit/runner/test/standing_accounting_test.py
      - python scripts/verify-hash-vectors.py

  # The registry contract is immutable once deployed: its committed build must be exactly what
  # the sha256-pinned compiler produces, and proving must keep every secret out of the bytes a
  # submitter sends. Proving takes about a minute on one core, so it runs at the lowest priority.
  - name: midnight-contract
    image: node:24-bookworm
    depends_on: [build-test]
    environment:
      COMPACTC: /woodpecker/orynq-midnight-tools/compactc/compactc
      MIDNIGHT_PP: /woodpecker/orynq-midnight-tools/zk-params
    commands:
      - corepack enable
      - |
        su node -s /bin/bash -c '
          set -e
          nice -n 19 packages/anchors-midnight/contract/compile.sh --check
          cd packages/anchors-midnight
          pnpm test:journal
          nice -n 19 pnpm test:slow
        '

  # The submitter proves with the installer's pinned DUST spend keys and parameters. pnpm test
  # also runs the preprod rehearsal's offline suite (the evidence gate, verify-all, compose and
  # finish.sh over a synthetic rehearsal), which runs git as the workspace's owner; nothing in
  # this step talks to a Midnight node or indexer.
  - name: midnight-submit
    image: node:24-bookworm
    depends_on: [build-test]
    environment:
      MIDNIGHT_PP: /woodpecker/orynq-midnight-tools/zk-params
    commands:
      - corepack enable
      - |
        su node -s /bin/bash -c '
          set -e
          cd packages/anchors-midnight-submit
          pnpm test
          nice -n 19 pnpm test:slow
        '

  # The Midnight mainnet runner's systemd user units, as systemd-analyze --user verify reads them
  # laid out as the install lays them out, verified by an unprivileged user.
  - name: midnight-runner-units
    image: debian:bookworm-slim
    depends_on: []
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends systemd
      - useradd -m runner
      - su runner -s /bin/sh -c "$CI_WORKSPACE/packages/anchors-midnight-submit/runner/systemd/verify.sh"

  - name: path-check
    image: alpine:3.20
    depends_on: []
    commands:
      - |
        if grep -rE "(D:/fluxPoint|D:\\\\fluxPoint|C:/Users|C:\\\\Users)" packages/; then
          echo "ERROR: Local machine paths found in codebase"
          exit 1
        fi

  - name: security-audit
    image: node:24-bookworm
    depends_on: []
    commands:
      - corepack enable
      - pnpm audit --audit-level=high
