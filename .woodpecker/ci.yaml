when:
  - event: pull_request
  - event: push
    branch: main

# The t-backend submodule is private and nothing here builds it; GitHub's
# checkout never fetched it either.
clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      recursive: false

steps:
  # Tests run as an unprivileged user, as on GitHub's runners: root can read a
  # mode-000 file, which defeats the recorder's unreadable-session-file probe.
  - name: build-test
    image: node:20-bookworm
    depends_on: []
    commands:
      - corepack enable
      - chown -R node:node .
      - su node -s /bin/bash -c "pnpm install --frozen-lockfile && pnpm build && pnpm typecheck && pnpm test && pnpm vectors:verify"

  # The cross-language vector tests shell out to the TS harness, so this needs
  # node and the workspace build-test installed.
  - name: python-test
    image: nikolaik/python-nodejs:python3.11-nodejs20
    depends_on: [build-test]
    commands:
      - pip install -e "python/.[dev]"
      - pytest python/tests/
      - python scripts/verify-hash-vectors.py

  - name: path-check
    image: alpine:3.20
    depends_on: []
    commands:
      - |
        if grep -rE "(D:/fluxPoint|D:\\\\fluxPoint|C:/Users|C:\\\\Users)" packages/; then
          echo "ERROR: Local machine paths found in codebase"
          exit 1
        fi

  # Advisory only, as before: a known advisory must not block unrelated work.
  # Blocking: with failure ignored, 78 high and critical advisories built up unnoticed.
  - name: security-audit
    image: node:20-bookworm
    depends_on: []
    commands:
      - corepack enable
      - pnpm audit --audit-level=high
