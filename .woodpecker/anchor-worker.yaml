# Builds ghcr.io/flux-point-studios/anchor-worker from the monorepo. Pull
# requests build without pushing; main pushes :<sha> and :latest. Deploying is a
# manual image bump on the host that runs the worker.
when:
  - event: pull_request
    path:
      include: &paths
        - services/anchor-worker/**
        - packages/anchors-cardano/**
        - packages/process-trace/**
        - packages/core/**
        - pnpm-lock.yaml
        - .woodpecker/anchor-worker.yaml
  - event: push
    branch: main
    path:
      include: *paths
  - event: manual
    branch: main

# The t-backend submodule is private and nothing here builds it; GitHub's
# checkout never fetched it either.
clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      recursive: false

variables:
  # plugin-kaniko 2.3.2, pinned by digest.
  - &kaniko woodpeckerci/plugin-kaniko@sha256:01e0e325efd8fd2b1a95d207e84780a85ed7f8eb9712d8e79888e0f42ff8b7b3
  # The ci/oci-index plugin from materios-operator-kit. The gchr_token secret's image
  # filter names this exact digest, so it is the only code here that can hold the token.
  - &oci_index ghcr.io/flux-point-studios/materios-operator-kit@sha256:d3178aaf4dc548dda5bd2d15a09f7c650ac1325fa7bc9215a861a3f34774c84b

steps:
  # Kaniko cannot run the image, so the service's own startup check runs here:
  # with no environment it must refuse to start and name what is missing.
  - name: refuses-to-start-without-config
    image: node:20-bookworm
    commands:
      - corepack enable
      - pnpm install --frozen-lockfile
      - pnpm --filter "@fluxpointstudios/anchor-worker..." build
      - |
        if out=$$(node services/anchor-worker/dist/index.js 2>&1); then
          echo "the worker started with no environment"; exit 1
        fi
        echo "$$out"
        echo "$$out" | grep -q "Missing required environment variables: ANCHOR_WORKER_TOKEN, BLOCKFROST_PROJECT_ID, CARDANO_NETWORK, WALLET_SEED_PHRASE"

  # Kaniko builds in userspace (no docker.sock or privileged mode on the shared agent)
  # and holds no registry credential: it runs the Dockerfile's RUN steps (pnpm install
  # and the package builds) in its own container, where any credential is readable.
  - name: build-image
    image: *kaniko
    settings:
      dockerfile: services/anchor-worker/Dockerfile
      context: .
      dry_run: true
      extra_opts: --custom-platform=linux/amd64 --oci-layout-path=/woodpecker/oci/amd64

  # One platform publishes the image itself (not an index): the same kind of manifest
  # kaniko used to push, so the host that pins it by digest sees no change.
  - name: publish
    image: *oci_index
    settings:
      registry: ghcr.io
      username: realdecimalist
      password:
        from_secret: gchr_token
      sources:
        - /woodpecker/oci/amd64=ghcr.io/flux-point-studios/anchor-worker:${CI_COMMIT_SHA}
      platforms:
        - linux/amd64
      target: ghcr.io/flux-point-studios/anchor-worker:${CI_COMMIT_SHA}
      tags:
        - latest
    when:
      - event: [push, manual]
        branch: main
